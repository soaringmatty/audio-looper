@let vm = workspace.view();
@let t = track();
@let fixedBars = vm.recordBars[t.id];
<div class="track-heading">
  <button
    class="track-select"
    (click)="vm.select(t.id); workspace.refresh()"
    [attr.aria-pressed]="vm.selected === t.id"
  >
    <span class="track-title">SPUR 0{{ t.id + 1 }}</span
    ><kbd>{{ t.id + 1 }}</kbd>
  </button>
</div>
<div class="dial-slot">
  <button
    class="loop-button"
    [id]="'audio-loop-' + t.id"
    [disabled]="vm.working || vm.s.calibrating"
    [class.recording]="vm.target(t) === 'recording'"
    [class.playing]="vm.target(t) === 'playing'"
    [class.overdub]="vm.target(t) === 'overdub'"
    [class.queued]="t.pending"
    [style.--progress]="vm.progress(t) + '%'"
    [attr.aria-label]="'Spur ' + (t.id + 1) + ': ' + vm.label(t)"
    (keydown)="vm.buttonKey($event, t.id); workspace.refresh()"
    (click)="vm.trigger(t.id); workspace.refresh()"
  >
    <span class="loop-inner"
      ><span class="loop-icon">{{
        t.state === 'empty' || t.state === 'armed'
          ? '+'
          : t.state === 'recording'
            ? '●'
            : t.state === 'overdub'
              ? '⊕'
              : '▶'
      }}</span
      ><span class="loop-label">{{ vm.label(t) }}</span>
      @if (t.muted) {
        <span class="mute-indicator">STUMM</span>
      }
      @if (t.autoEnd !== undefined && t.state === 'recording') {
        <span class="auto-countdown">{{ vm.autoRemaining(t) | number: '1.1-1' }} s</span>
      }
    </span>
  </button>
</div>
<div class="track-info">
  <span class="pending" aria-live="polite">{{ vm.hint(t) }}</span>
</div>
<div class="audio-track-source">
  <strong [title]="vm.audio.trackLabels[t.id]">{{
    vm.audio.trackInputs[t.id] ? vm.audio.trackLabels[t.id] : ''
  }}</strong>
</div>
<div class="track-values">
  <div class="volume">
    <label [for]="'audio-volume-' + t.id"
      >Lautstärke <span>{{ t.volume * 100 | number: '1.0-0' }} %</span></label
    ><input
      [id]="'audio-volume-' + t.id"
      type="range"
      min="0"
      max="1"
      step="0.01"
      [ngModel]="t.volume"
      (ngModelChange)="vm.volume(t, $event); workspace.refresh()"
    />
  </div>
  <div class="track-bars" [class.has-fixed-bars]="!!fixedBars">
    <label
      class="track-length"
      [attr.for]="t.state === 'empty' ? 'record-bars-audio-' + t.id : null"
    >
      <span>Takte</span>
      @if (t.state === 'empty') {
        <input
          [id]="'record-bars-audio-' + t.id"
          type="number"
          min="1"
          max="64"
          step="1"
          placeholder="Manuell"
          title="Leer = manuelle Aufnahme. Eine feste Taktzahl beendet die Erstaufnahme automatisch."
          [attr.aria-label]="'Feste Taktzahl Spur ' + (t.id + 1)"
          [class.has-value]="!!vm.recordBars[t.id]"
          [ngModel]="vm.recordBars[t.id]"
          (ngModelChange)="vm.setRecordBars(t, $event); workspace.refresh()"
        />
      } @else {
        <output class="track-bars-value" [attr.aria-label]="'Taktzahl Spur ' + (t.id + 1)">{{
          vm.barCount(t) || '—'
        }}</output>
      }
    </label>
    @if (t.state === 'empty' && vm.recordBars[t.id]) {
      <button
        type="button"
        class="bars-clear"
        [attr.aria-label]="'Takte Spur ' + (t.id + 1) + ' zurücksetzen'"
        title="Auf Manuell zurücksetzen"
        (click)="vm.setRecordBars(t, null); workspace.refresh()"
      >
        ×
      </button>
    }
  </div>
</div>
<div class="track-actions">
  <button
    class="mute-button"
    [class.active]="t.muted"
    [class.unmute-queued]="t.unmuteAt !== undefined"
    [attr.aria-pressed]="t.muted"
    [attr.aria-label]="'Spur ' + (t.id + 1) + ': Stumm ' + (t.muted ? 'an' : 'aus')"
    [title]="
      t.unmuteAt !== undefined
        ? 'Aktivierung vorgemerkt; erneut drücken zum Abbrechen'
        : 'Stumm umschalten (Shift+M)'
    "
    (click)="vm.command('mute', t.id); workspace.refresh()"
  >
    Stumm: {{ t.muted ? 'An' : 'Aus' }}</button
  ><button
    class="delete"
    [disabled]="t.state === 'empty'"
    (click)="vm.command('clear', t.id); workspace.refresh()"
    [attr.aria-label]="'Audiospur ' + (t.id + 1) + ' löschen'"
  >
    Löschen
  </button>
</div>
