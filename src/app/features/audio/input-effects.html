@let vm = workspace.view();
<div class="performance-heading">
  <h2>
    Effekte <span>Spur {{ vm.selected + 1 }}</span>
  </h2>
  <info-hint
    label="Info zu Eingangseffekten"
    text="Effekte werden in neue Aufnahmen geschrieben und live mitgehört. Bestehende Loops bleiben unverändert. Einstellungen werden pro Spur gemerkt; Kein Effekt gibt den Originaleingang wieder."
  />
</div>
<div class="fx-presets" role="group" aria-label="Eingangs-Sound wählen">
  @for (p of vm.fxPresets; track p.id) {
    <button
      [disabled]="vm.fxLocked"
      [class.active]="vm.audio.inputFx.preset === p.id"
      [attr.aria-pressed]="vm.audio.inputFx.preset === p.id"
      [title]="p.description"
      (click)="vm.preset(p.id); workspace.refresh()"
    >
      {{ p.name }}
    </button>
  }
</div>
<div class="fx-controls">
  <div class="fx-intensity">
    <label for="fx-amount"
      >{{ vm.audio.inputFx.preset === 'bass' ? 'Bass-Anteil' : 'Intensität' }}
      <span>{{ vm.audio.inputFx.amount * 100 | number: '1.0-0' }} %</span></label
    ><input
      id="fx-amount"
      aria-label="Effekt-Intensität"
      type="range"
      min="0"
      max="1"
      step="0.01"
      [disabled]="vm.fxLocked || vm.audio.inputFx.preset === 'clean'"
      [ngModel]="vm.audio.inputFx.amount"
      (ngModelChange)="vm.audio.updateInputFx({ amount: +$event }); workspace.refresh()"
    />
  </div>
  <button
    [disabled]="vm.fxLocked || vm.audio.inputFx.preset === 'clean'"
    (click)="vm.openFx(); workspace.refresh()"
  >
    Details
  </button>
  @if (vm.s.fxPeak >= 1) {
    <span class="clipping" role="status">FX-Pegel zu hoch</span>
  }
</div>
