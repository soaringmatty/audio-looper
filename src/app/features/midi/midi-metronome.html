@let vm = workspace.view();
<div class="tool-heading">
  <h2>
    <svg
      class="ui-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m8 3-5 18h18L16 3Z M12 17l5-11M8 17h8" /></svg
    >Metronom
  </h2>
  <button
    class="metro-switch"
    role="switch"
    [attr.aria-checked]="vm.metro.enabled"
    aria-label="Metronom"
    title="Metronom an/aus (T)"
    (click)="vm.toggleMetro(); workspace.refresh()"
  >
    <span></span>
  </button>
</div>
<div class="tempo-control-slot" [class.choosing]="vm.showTempoChoice">
  @if (vm.showTempoChoice) {
    <tempo-suggestion
      class="tempo-inline"
      [locked]="vm.tempoChoiceLocked"
      [candidates]="vm.tempoCandidates"
      [index]="vm.tempoIndex"
      (choose)="vm.applyTempoChoice($event); workspace.refresh()"
    />
  } @else {
    <label class="tempo-field"
      >Tempo
      <div>
        <input
          aria-label="Tempo"
          type="number"
          min="30"
          max="300"
          [disabled]="vm.engine.tempoLocked"
          [ngModel]="vm.displayBpm"
          (change)="vm.changeTempo($any($event.target).value); workspace.refresh()"
        /><span>BPM</span>
      </div></label
    >
    <label class="signature-field"
      >Taktart<select
        aria-label="Taktart"
        [disabled]="vm.engine.busy"
        [ngModel]="vm.signature"
        (ngModelChange)="vm.setSignature($event); workspace.refresh()"
      >
        <option>4/4</option>
        <option>3/4</option>
        <option>6/8</option>
        <option>5/4</option>
      </select></label
    >
    @if (vm.tempoCandidates.length && vm.tempoConfirmed) {
      <button
        class="quiet-button redivide"
        aria-label="Tempo-Einteilung ändern"
        title="Tempo-Einteilung ändern"
        (click)="vm.tempoOpen = true; workspace.refresh()"
      >
        ↻
      </button>
    }
  }
</div>
<div class="metro-secondary">
  <select
    id="metronome-output-midi"
    aria-label="Metronom-Ausgang"
    [ngModel]="vm.metro.outputMode"
    (ngModelChange)="vm.setMetronomeOutput($event); workspace.refresh()"
  >
    <option value="laptop">Lautsprecher</option>
    <option value="midi" [disabled]="vm.midi.outputId === 'browser' || !vm.midi.outputReady">
      MIDI
    </option>
  </select>
  <label class="metro-level"
    ><svg
      class="ui-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m11 5-6 4H2v6h3l6 4ZM16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14" /></svg
    ><input
      aria-label="Metronom-Lautstärke"
      type="range"
      min="0"
      max="100"
      step="1"
      [(ngModel)]="vm.metroPercent"
      (input)="vm.metro.setVolume(); vm.savePreferences(); workspace.refresh()"
    /><span>{{ vm.metroPercent }} %</span></label
  >
</div>
