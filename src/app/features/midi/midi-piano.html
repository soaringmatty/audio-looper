@let vm = workspace.view();
<div class="piano-tools">
  <h2>
    <svg
      class="ui-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="2" y="4" width="20" height="16" rx="2" />
      <path d="M6 4v9h3V4M15 4v9h3V4M7 13v7M12 4v16M17 13v7" /></svg
    >Browser-Piano
  </h2>
  <div class="octave-controls">
    <button
      aria-label="Oktave tiefer"
      title="Oktave tiefer (↓)"
      [disabled]="!vm.piano.canShiftWhite(-7)"
      (click)="vm.shiftOctave(-1); workspace.refresh()"
    >
      ↓
    </button>
    <button
      aria-label="Eine Weißtaste tiefer"
      title="Eine Weißtaste tiefer (←)"
      [disabled]="!vm.piano.canShiftWhite(-1)"
      (click)="vm.shiftPiano(-1); workspace.refresh()"
    >
      ←
    </button>
    <span>{{ vm.piano.rangeLabel }} </span>
    <button
      aria-label="Eine Weißtaste höher"
      title="Eine Weißtaste höher (→)"
      [disabled]="!vm.piano.canShiftWhite(1)"
      (click)="vm.shiftPiano(1); workspace.refresh()"
    >
      →
    </button>
    <button
      aria-label="Oktave höher"
      title="Oktave höher (↑)"
      [disabled]="!vm.piano.canShiftWhite(7)"
      (click)="vm.shiftOctave(1); workspace.refresh()"
    >
      ↑
    </button>
  </div>
</div>
@if (vm.midi.outputId === 'browser' && !vm.midi.browser.channels[vm.engine.selected].loaded) {
  <div class="piano-loading" role="status">
    Instrumente werden vorbereitet · Beim Spielen startet Audio automatisch.
  </div>
}
<div
  id="piano-surface"
  class="piano-keys"
  [class.keyboard-navigation]="vm.pianoKeyboardFocus"
  (pointermove)="vm.pianoMove($event); workspace.refresh()"
  (pointerup)="vm.pianoUp($event); workspace.refresh()"
  (pointercancel)="vm.pianoUp($event); workspace.refresh()"
  (lostpointercapture)="vm.pianoUp($event); workspace.refresh()"
  tabindex="0"
  aria-label="88 Klaviertasten A0 bis C8. Pfeile links/rechts verschieben um eine Weißtaste, hoch/runter um eine Oktave."
>
  @for (k of vm.fullPiano; track k.note) {
    <button
      class="piano-key"
      [attr.data-note]="k.note"
      [class.black]="k.black"
      [class.white]="!k.black"
      [class.mapped]="vm.piano.mapped(k.note)"
      [class.pressed]="vm.piano.activeNote(k.note)"
      [style.--position]="k.position"
      [attr.title]="vm.drumLabel(k.note) || k.name"
      [attr.aria-label]="
        k.name +
        (vm.drumLabel(k.note) ? ', ' + vm.drumLabel(k.note) : '') +
        (vm.piano.binding(k.note) ? ', Taste ' + vm.piano.binding(k.note) : '')
      "
      [attr.aria-pressed]="vm.piano.activeNote(k.note)"
      (pointerdown)="vm.pianoDown($event, k.note); workspace.refresh()"
      (keydown)="vm.pianoKeyboard($event, k.note, true); workspace.refresh()"
      (keyup)="vm.pianoKeyboard($event, k.note, false); workspace.refresh()"
      (blur)="vm.release(); workspace.refresh()"
    >
      <span class="piano-binding">{{ vm.piano.binding(k.note) }}</span>
      @if (!k.black && k.name.startsWith('C')) {
        <span class="note-name">{{ k.name }}</span>
      }
    </button>
  }
</div>
